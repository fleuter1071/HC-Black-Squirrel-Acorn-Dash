<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 260" role="img" aria-labelledby="title desc">
  <title id="title">Puree — Rugby Buddy</title>
  <desc id="desc">Puree, a cute male student with light reddish hair, a friendly smile, and a striped rugby jersey. He is buddies with Dave and can be used as a reusable campus character sprite.</desc>
